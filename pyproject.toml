[project]
name = "fatigue"
version = "0.1.0"
description = "Creative fatigue modelled against cumulative frequency rather than calendar time, so seasonality stops masquerading as burnout."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
